version: "2"
sql:
  - engine: "postgresql"
    queries: "./query"
    schema: "./migrations"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        overrides:
          # - db_type: "uuid"
          #   go_type:
          #     import: "github.com/google/uuid"
          #     type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
